name: Offline bootstrap checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          npm ci --prefix frontend
      - name: Domain, contracts and frontend
        run: .venv/bin/python scripts/verify.py
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Synthetic browser smoke
        run: |
          .venv/bin/python -m uvicorn app.main:app --app-dir backend --host 127.0.0.1 --port 8000 > /tmp/cqa-backend.log 2>&1 &
          BACKEND_PID=$!
          trap 'kill "$BACKEND_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/health
          npm --prefix frontend run test:e2e
      - name: Browser report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
